services:
  nginx:
    image: nginx:1.25.2-alpine
    container_name: app_blog_nginx
    ports:
      - "${SERVER_PORT}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ${WORKSPACE_BACKEND}:/var/www/backend
      - ${WORKSPACE_FRONTEND}:/var/www/frontend
    depends_on:
      - backend
      - frontend
    networks:
      blog-network:
        ipv4_address: ${SERVER_IP_ADDRESS:-172.23.0.10}

  db:
    image: postgres:16
    container_name: app_blog_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - blog-network
  
  backend:
    build:
      context: ./backend/php
      dockerfile: Dockerfile
    container_name: app_blog_backend
    volumes:
      - ${WORKSPACE_BACKEND}:/var/www/backend
      - ./backend/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      DEBUG_MODE: ${BACKEND_DEBUG_MODE:-false}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    extra_hosts:
      - "dev.frontend.local:${SERVER_IP_ADDRESS}"
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - blog-network

  frontend:
    build:
      context: ./frontend/node
      dockerfile: Dockerfile
    container_name: app_blog_frontend
    volumes:
      - ${WORKSPACE_FRONTEND}:/var/www/frontend
    extra_hosts:
      - "dev.frontend.local:${SERVER_IP_ADDRESS}"
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_VOLUME}